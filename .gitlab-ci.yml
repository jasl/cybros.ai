# The deploy remote uses Linux Docker runners accepting untagged jobs.
# Keep the bounded checks aligned with .github/workflows/ci.yml.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages: [test]

default:
  interruptible: true
  timeout: 20m

variables:
  # Docker's latest published Ruby image as of 2026-10-24.
  # This image pin can lag .ruby-version and GitHub's ruby/setup-ruby release.
  RUBY_VERSION: "4.0.9"
  BUN_VERSION: "1.4.4"
  BUNDLE_FROZEN: "true"
  DEBIAN_FRONTEND: noninteractive

.bun_setup:
  before_script: &install_bun
    - export BUN_INSTALL="${BUN_INSTALL:-/usr/local/bun}"
    - export PATH="$BUN_INSTALL/bin:$PATH"
    - curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"

.ruby:
  image: ruby:${RUBY_VERSION}
  cache:
    key: ruby-${RUBY_VERSION}-${CI_JOB_NAME_SLUG}
    paths:
      - vendor/bundle/
  before_script: &ruby_setup
    # Use HTTPS for runners that block HTTP egress. Failed index downloads must
    # stop setup before installation reports valid packages as missing.
    - |
      ci_sudo=""
      if [ "$(id -u)" -ne 0 ]; then
        ci_sudo=sudo
      fi
      for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
        if [ -f "$source" ]; then
          $ci_sudo sed -i 's|http://|https://|g' "$source"
        fi
      done
    - $ci_sudo apt-get update --error-on=any -o Acquire::Retries=3
    - $ci_sudo apt-get install --no-install-recommends -y curl unzip ${CI_APT_PACKAGES:-}
    # The Ruby image sets BUNDLE_APP_CONFIG globally. Each project needs its own
    # config so isolated E2E children can find their bundle after clearing ENV.
    - unset BUNDLE_APP_CONFIG
    - cd "$CI_PROJECT_DIR/$PROJECT_DIR"
    - bundle config set --local path "$CI_PROJECT_DIR/vendor/bundle"
    - bundle config set --local frozen true
    - bundle install --jobs 1

.ruby_bun:
  extends: .ruby
  before_script:
    - *ruby_setup
    - *install_bun

.ruby_browsers:
  extends: .ruby
  image:
    name: cimg/ruby:${RUBY_VERSION}-browsers
    entrypoint: [""]
  cache:
    key: ruby-browsers-${RUBY_VERSION}-${CI_JOB_NAME_SLUG}
  variables:
    BUN_INSTALL: /home/circleci/.bun
    E2E_CHROME_BINARY: /usr/local/bin/chrome-ci
    E2E_CHROMEDRIVER: /usr/local/bin/chromedriver
    SE_BROWSER_PATH: /usr/local/bin/chrome-ci
    # Rails needs Manager's browser-path resolution, using the installed driver.
    SE_OFFLINE: "true"
  before_script: &ruby_browsers_setup
    - *ruby_setup
    - *install_bun
    # The image includes Chrome but no ChromeDriver. Install a matching driver
    # once so browser sessions do not need Selenium Manager's online lookup.
    - |
      chrome_version=$(google-chrome --product-version)
      driver_version=$(curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 \
        "https://raw.githubusercontent.com/GoogleChromeLabs/chrome-for-testing/gh-pages/LATEST_RELEASE_${chrome_version%.*}")
      driver_dir=$(mktemp -d)
      curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
        "https://storage.googleapis.com/chrome-for-testing-public/${driver_version}/linux64/chromedriver-linux64.zip" \
        -o "$driver_dir/chromedriver.zip"
      unzip -q "$driver_dir/chromedriver.zip" -d "$driver_dir"
      sudo install -m 0755 "$driver_dir/chromedriver-linux64/chromedriver" "$E2E_CHROMEDRIVER"
      rm -rf "$driver_dir"
      # These flags belong to the disposable CI container, not browser assertions.
      sudo tee "$SE_BROWSER_PATH" >/dev/null <<'SH'
      #!/bin/sh
      exec /usr/bin/google-chrome --no-sandbox --disable-dev-shm-usage "$@"
      SH
      sudo chmod +x "$SE_BROWSER_PATH"
      "$SE_BROWSER_PATH" --version
      "$E2E_CHROMEDRIVER" --version

.gem:
  extends: .ruby
  script:
    - bundle exec rake
    - bundle exec rake build

.postgres:
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
    RAILS_DB_URL_BASE: postgres://postgres:postgres@postgres:5432
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: postgres
    PGPASSWORD: postgres

.nexus:
  extends: .ruby_bun
  variables:
    PROJECT_DIR: nexus
    CI_APT_PACKAGES: libpq-dev libvips

nexus_lint:
  extends: .nexus
  variables:
    RUBOCOP_CACHE_ROOT: tmp/rubocop
  cache:
    paths:
      - vendor/bundle/
      - nexus/tmp/rubocop/
  script:
    - ruby ../bin/lint-eof
    - bin/brakeman --no-pager
    - bin/bundler-audit
    - bin/rubocop
    - bundle exec archspec check

nexus_lint_js:
  image: node:24-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install --no-install-recommends -y unzip
    - *install_bun
  script:
    - cd nexus
    - bun install --frozen-lockfile
    - bun run lint:js
    - bun run test:js
    - node --version
    - |
      bun -e 'const s = require("./package.json").scripts; for (const [k, v] of Object.entries(s)) { if (!/^bun( |$)/.test(v)) { console.error(k + " does not run under bun: " + v); process.exit(1) } }'
      bun -e 'if (!process.versions.bun) process.exit(1)'

nexus_test:
  extends: [.nexus, .postgres]
  variables:
    RAILS_ENV: test
  script:
    - EDITOR=cat bin/rails credentials:edit
    - bin/test-smoke
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - nexus/log/test.log

nexus_system_test:
  extends: [.nexus, .ruby_browsers, .postgres]
  variables:
    RAILS_ENV: test
  script:
    - EDITOR=cat bin/rails credentials:edit
    - bin/rails db:test:prepare test:system
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - nexus/tmp/screenshots/
      - nexus/log/test.log

simple_inference:
  extends: .ruby
  variables:
    PROJECT_DIR: nexus/vendor/simple_inference
  script:
    - bundle exec rake

agent_sdk_ruby:
  extends: .gem
  variables:
    PROJECT_DIR: sdks/ruby

agent_sdk_typescript:
  image: node:${NODE_VERSION}-bookworm
  parallel:
    matrix:
      - NODE_VERSION: ["24", "26"]
  cache:
    key: pnpm-${NODE_VERSION}
    paths:
      - .cache/pnpm/
  before_script:
    - cd sdks/typescript
    - npm install --global "$(node -p 'require("./package.json").packageManager')"
    - pnpm install --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.cache/pnpm"
  script:
    - pnpm run check

agent_sdk_rust:
  image: rust:1.99.1
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
  cache:
    key: rust-1.99.1
    paths:
      - .cache/cargo/registry/
      - .cache/cargo/git/
      - sdks/rust/target/
  before_script:
    - rustup component add rustfmt clippy
    - rustup toolchain install 1.88.0 --profile minimal
    - cd sdks/rust
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test --locked
    - cargo test --locked --all-features
    - RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps --all-features
    - cargo +1.88.0 check --locked --all-features
    # Local bin/ci allows a dirty checkout; CI packaging should reject one.
    - cargo package --locked
    - bin/package-smoke

cmctl:
  extends: .gem
  variables:
    PROJECT_DIR: cmctl

agent_rho:
  extends: .gem
  variables:
    PROJECT_DIR: agents/rho/rho
    CI_APT_PACKAGES: shellcheck jq
  script:
    - bundle exec rake smoke rubocop rbs:validate install:check
    - bundle exec rake build
    - RHO_INSTALL_TEST_OFFLINE=1 ../../../install/test/run.sh

agent_rho_env:
  extends: [.gem, .ruby_bun]
  variables:
    PROJECT_DIR: agents/rho/rho-env
    CI_APT_PACKAGES: ripgrep fd-find

agent_rho_t3:
  extends: [.gem, .ruby_bun]
  variables:
    PROJECT_DIR: agents/rho/rho-t3

agent_rho_browser:
  extends: .gem
  variables:
    PROJECT_DIR: agents/rho/rho-browser

agent_rho_mcp:
  extends: .gem
  variables:
    PROJECT_DIR: agents/rho/rho-mcp

agent_rho_web_tools:
  extends: .gem
  variables:
    PROJECT_DIR: agents/rho/rho-web-tools

agent_rho_codemode:
  extends: .gem
  variables:
    PROJECT_DIR: agents/rho/rho-codemode

agent_rho_webui:
  extends: [.gem, .ruby_bun]
  variables:
    PROJECT_DIR: agents/rho/rho-webui

agent_rho_ingress_telegram:
  extends: [.gem, .ruby_bun]
  variables:
    PROJECT_DIR: agents/rho/rho-ingress-telegram

agent_rho_dev:
  extends: .ruby
  variables:
    PROJECT_DIR: agents/rho/rho-dev
  script:
    - bundle exec rake

agent_rho_acp:
  extends: .gem
  variables:
    PROJECT_DIR: agents/rho/rho-acp

agent_rho_acp_client:
  extends: .gem
  variables:
    PROJECT_DIR: agents/rho/rho-acp-client

guides_build:
  image: oven/bun:${BUN_VERSION}
  before_script:
    # VitePress reads Git history when building page timestamps.
    - apt-get update -qq
    - apt-get install --no-install-recommends -y git
  script:
    - cd guides
    - bun install --frozen-lockfile
    - bun run build
    - |
      bun -e 'const s = require("./package.json").scripts; for (const [k, v] of Object.entries(s)) { if (!/^bun( |$)/.test(v)) { console.error(k + " does not run under bun: " + v); process.exit(1) } }'

e2e_protocol:
  extends: [.ruby_browsers, .postgres]
  timeout: 30m
  variables:
    PROJECT_DIR: e2e/protocol
    CI_APT_PACKAGES: libpq-dev libvips ripgrep fd-find
    E2E_WORLDS: "1"
    E2E_DEADLINE_SECONDS: "300"
    E2E_TEARDOWN_DEADLINE_SECONDS: "60"
    A: "-v"
  before_script:
    - *ruby_browsers_setup
    - |
      for project in nexus; do
        cd "$CI_PROJECT_DIR/$project"
        bundle config set --local path "$CI_PROJECT_DIR/vendor/bundle"
        bundle config set --local frozen true
        bundle install --jobs 1
      done
    - |
      curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
      sudo apt-get install --no-install-recommends -y nodejs
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
      . "$HOME/.cargo/env"
      cd "$CI_PROJECT_DIR/sdks/typescript"
      sudo npm install --global "$(node -p 'require("./package.json").packageManager')"
      pnpm install --frozen-lockfile
      pnpm run build
      cd "$CI_PROJECT_DIR/sdks/rust"
      cargo build --locked --features realtime --example e2e_driver
    - cd "$CI_PROJECT_DIR/e2e/protocol"
  script:
    - |
      set -o pipefail
      mkdir -p tmp
      rho_source=$(mktemp -d)
      mv ../../agents/rho "$rho_source/rho"
      trap 'mv "$rho_source/rho" ../../agents/rho; rmdir "$rho_source"' EXIT
      bundle exec rake smoke_harness_test smoke rubocop 2>&1 | tee tmp/ci-smoke.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - e2e/artifacts/
      - e2e/protocol/tmp/ci-smoke.log
      - e2e/protocol/artifacts/

e2e_products:
  extends: [.ruby_browsers, .postgres]
  timeout: 30m
  variables:
    PROJECT_DIR: e2e/products
    CI_APT_PACKAGES: libpq-dev libvips ripgrep fd-find
    E2E_WORLDS: "1"
    E2E_DEADLINE_SECONDS: "300"
    E2E_TEARDOWN_DEADLINE_SECONDS: "60"
    A: "-v"
  before_script:
    - *ruby_browsers_setup
    - |
      for project in nexus agents/rho/rho; do
        cd "$CI_PROJECT_DIR/$project"
        bundle config set --local path "$CI_PROJECT_DIR/vendor/bundle"
        bundle config set --local frozen true
        bundle install --jobs 1
      done
    - cd "$CI_PROJECT_DIR/e2e/products"
  script:
    - |
      set -o pipefail
      mkdir -p tmp
      bundle exec rake smoke_harness_test smoke rubocop 2>&1 | tee tmp/ci-smoke.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - e2e/artifacts/
      - e2e/products/tmp/ci-smoke.log
      - e2e/products/artifacts/
