[package]
name = "cybros-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Typed asynchronous clients and agent protocol helpers for Cybros Nexus"
license = "MIT"
repository = "https://github.com/jasl/cybros.ai"
readme = "README.md"
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
default = []
realtime = ["dep:tokio-tungstenite"]

[dependencies]
async-trait = "0.1.89"
bytes = "1.11"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
eventsource-stream = "0.2.3"
futures-util = { version = "0.3.31", features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "multipart", "stream", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
base64 = "0.23.1"
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", optional = true, features = ["rustls-tls-webpki-roots"] }
url = "2.5.7"

[lints.rust]
unsafe_code = "forbid"
