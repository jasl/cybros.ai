# One complete rho application with its Local tools and browser console.
# Nexus is wherever RHO_NEXUS_URL points. Configure its browser callback for
# RHO_PUBLIC_URL/auth/callback; direct HTTP also needs Nexus's HTTP opt-in.
#
# docker compose -f install/docker/compose.yml up -d rho
# docker compose -f install/docker/compose.yml exec rho rho connect
# docker compose -f install/docker/compose.yml exec rho rho status
# docker compose -f install/docker/compose.yml stop

services:
  rho:
    # Replace this example tag with your published image or pinned digest.
    image: ghcr.io/jasl/rho:release
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      RHO_DISPLAY_NAME: "rho on ${HOSTNAME:-docker}"
      RHO_NEXUS_URL: ${RHO_NEXUS_URL:-http://host.docker.internal:3000}
      RHO_NEXUS_PUBLIC_URL: ${RHO_NEXUS_PUBLIC_URL:-http://localhost:3000}
      RHO_PUBLIC_URL: ${RHO_PUBLIC_URL:-http://localhost:7777}
      RHO_TOOLS_ROOT: /home/runner
    working_dir: /home/runner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["server", "--bind", "0.0.0.0", "--port", "7777", "--unsafe-plaintext"]
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      # Each application owns its home and Local environment.
      - rho-home:/var/lib/rho
      - ${RHO_PROJECT:-./}:/home/runner

volumes:
  rho-home: {}
