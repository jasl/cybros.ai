# Dokploy owns deployment, domains and updates for this installation.
# Configure its Environment tab, then route nexus:80 and rho:7777 over HTTPS.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-nexus: &nexus
  image: "jasl123/cybros-nexus:${CYBROS_IMAGE_TAG:-latest}"
  entrypoint: []
  environment: &nexus-environment
    RAILS_ENV: production
    RAILS_DB_POOL:
    PGHOST: db
    PGUSER: postgres
    PGPASSWORD: "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE:?Missing SECRET_KEY_BASE}"
    ACTIVE_RECORD_ENCRYPTION__PRIMARY_KEY: "${ACTIVE_RECORD_ENCRYPTION__PRIMARY_KEY:?Missing encryption key}"
    ACTIVE_RECORD_ENCRYPTION__DETERMINISTIC_KEY: "${ACTIVE_RECORD_ENCRYPTION__DETERMINISTIC_KEY:?Missing encryption key}"
    ACTIVE_RECORD_ENCRYPTION__KEY_DERIVATION_SALT: "${ACTIVE_RECORD_ENCRYPTION__KEY_DERIVATION_SALT:?Missing encryption salt}"
    NEXUS_SETUP_SECRET: "${NEXUS_SETUP_SECRET:-}"
    BASE_URL: "${CYBROS_NEXUS_URL:?Missing HTTPS Nexus URL}"
    NEXUS_OAUTH_REDIRECT_URIS: '["${CYBROS_RHO_URL:?Missing HTTPS rho URL}/auth/callback"]'
    NEXUS_OAUTH_ALLOW_HTTP: "false"
    SOLID_QUEUE_IN_PUMA: "false"
    THRUSTER_LOG_REQUESTS: "false"
  volumes:
    - nexus-storage:/rails/storage
  networks:
    - default
  logging: *logging

services:
  data_init:
    image: "jasl123/cybros-nexus:${CYBROS_IMAGE_TAG:-latest}"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /data/nexus/storage /data/rho/home/tmp /data/rho/work && chown -R 1000:1000 /data/nexus/storage /data/rho/home /data/rho/work && chmod 700 /data/rho/home /data/rho/home/tmp"
    volumes:
      - nexus-storage:/data/nexus/storage
      - rho-home:/data/rho/home
      - rho-work:/data/rho/work
    restart: "no"
    logging: *logging

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/18
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - default
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  migrator:
    <<: *nexus
    depends_on:
      data_init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"
    command: ["./bin/rails", "db:prepare"]

  nexus:
    <<: *nexus
    environment:
      <<: *nexus-environment
      WEB_CONCURRENCY:
      RAILS_MAX_THREADS:
    restart: unless-stopped
    depends_on: &nexus-dependencies
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["./bin/thrust", "./bin/rails", "server"]
    expose:
      - "80"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 30s

  jobs:
    <<: *nexus
    restart: unless-stopped
    depends_on: *nexus-dependencies
    command: ["./bin/jobs"]

  model_runner:
    <<: *nexus
    restart: unless-stopped
    depends_on: *nexus-dependencies
    stop_grace_period: 35s
    command: ["./bin/model_runner"]

  rho:
    image: "jasl123/cybros-rho:${CYBROS_IMAGE_TAG:-latest}"
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      nexus:
        condition: service_healthy
    environment:
      RHO_MODE: full
      RHO_HOME: /var/lib/rho
      RHO_TOOLS_ROOT: /home/runner
      RHO_NEXUS_URL: http://nexus
      RHO_NEXUS_PUBLIC_URL: "${CYBROS_NEXUS_URL}"
      RHO_PUBLIC_URL: "${CYBROS_RHO_URL}"
    command: [server, --bind, "0.0.0.0", --port, "7777", --expect-external-encryption]
    working_dir: /home/runner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "7777"
    volumes:
      - rho-home:/var/lib/rho
      - rho-work:/home/runner
    networks:
      - default
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", "http://127.0.0.1:7777/healthz"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 15s
    logging: *logging

volumes:
  postgres-data:
  nexus-storage:
  rho-home:
  rho-work:

networks:
  default:
