schema_version: cybros.model_catalog.v1
providers:
  anthropic:
    api_format: anthropic_messages
    base_url: https://api.anthropic.com
    concurrency_limit: 6
models:
  # Standard Messages API rates in USD per million tokens.
  # https://platform.claude.com/docs/en/about-claude/pricing
  # All four models check the prefix of signed thinking blocks. drop_block
  # lets a request continue if an earlier change invalidates a block.
  anthropic/claude-fable-5-2:
    inherit: claude-fable-5-2
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "8"
          output_per_mtok: "40"
          cached_input_per_mtok: "0.20"
          cache_write_per_mtok: "10"
          cache_write_1h_per_mtok: "16"
    wire_options:
      thinking_binding: drop_block
      mid_conversation_system: true
      forced_tool_choice: false
    capabilities:
      reasoning:
        modes: [adaptive]
        summaries: [summarized, omitted]
        budget: manual_mode_only
      reasoning_replay:
        format: anthropic_thinking
      generation_parameters:
        prompt_cache_ttl:
          default: null
          allowed_values: [5m, 1h]
        max_output_tokens:
          default: 128000
          maximum: 128000
  anthropic/claude-opus-5-5:
    inherit: claude-opus-5-5
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "4"
          output_per_mtok: "20"
          cached_input_per_mtok: "0.20"
          cache_write_per_mtok: "5"
          cache_write_1h_per_mtok: "8"
    wire_options:
      thinking_binding: drop_block
      mid_conversation_system: true
      forced_tool_choice: false
    capabilities:
      reasoning:
        modes: [adaptive]
        summaries: [summarized, omitted]
        budget: manual_mode_only
      reasoning_replay:
        format: anthropic_thinking
      generation_parameters:
        prompt_cache_ttl:
          default: null
          allowed_values: [5m, 1h]
        max_output_tokens:
          default: 128000
          maximum: 128000
  anthropic/claude-sonnet-5-5:
    inherit: claude-sonnet-5-5
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "2"
          output_per_mtok: "10"
          cached_input_per_mtok: "0.10"
          cache_write_per_mtok: "2.50"
          cache_write_1h_per_mtok: "4"
    wire_options:
      thinking_binding: drop_block
      mid_conversation_system: true
      forced_tool_choice: false
    capabilities:
      reasoning:
        modes: [adaptive, between_tools]
        summaries: [summarized, omitted]
        budget: manual_mode_only
      reasoning_replay:
        format: anthropic_thinking
      generation_parameters:
        prompt_cache_ttl:
          default: null
          allowed_values: [5m, 1h]
        max_output_tokens:
          default: 128000
          maximum: 128000
  anthropic/claude-haiku-5-5:
    inherit: claude-haiku-5-5
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "0.10"
          output_per_mtok: "0.50"
          cached_input_per_mtok: "0.01"
          cache_write_per_mtok: "0.125"
          cache_write_1h_per_mtok: "0.20"
          # Both sides of the request cost 5x past 100k cache-inclusive input.
          long_context_threshold_tokens: "100000"
          long_context_input_multiplier: "5"
          long_context_output_multiplier: "5"
    wire_options:
      thinking_binding: drop_block
      mid_conversation_system: true
    capabilities:
      reasoning:
        modes: [adaptive]
        summaries: [summarized, omitted]
        budget: manual_mode_only
      reasoning_replay:
        format: anthropic_thinking
      generation_parameters:
        prompt_cache_ttl:
          default: null
          allowed_values: [5m, 1h]
        max_output_tokens:
          default: 128000
          maximum: 128000
