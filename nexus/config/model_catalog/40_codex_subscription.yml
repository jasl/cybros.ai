schema_version: cybros.model_catalog.v1
providers:
  codex_subscription:
    # THE WIRE THIS PROVIDER SPEAKS. It decides the route, the request
    # shape, the option vocabulary, the timeouts and the tokenizer, so a
    # model under it normally declares nothing at all.
    api_format: codex_responses
    credentials: codex
    base_url: https://chatgpt.com/backend-api/codex
    # Operator capacity, not a wire fact: the same provider admits
    # different amounts of concurrent work per deployment and per account
    # tier. Carried from the predecessor's own providers.yml. A workload
    # with no entry inherits the ceiling.
    concurrency_limit: 8
    workload_concurrency_limits:
      text_generation: 7
      image_generation: 1
models:
  # Codex models-manager and subscription inventory (2026-11-21).
  # The default and maximum context windows are subscription-specific.
  # Nexus selects medium effort. Ultra delegates work in the Codex client.
  # Subscription accounting uses the same model's Standard API list rates.
  codex_subscription/gpt-6.2-astra:
    inherit: gpt-6.2-astra
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "8"
          output_per_mtok: "40"
          cached_input_per_mtok: "0.4"
          cache_write_per_mtok: "10"
    capabilities:
      input_modalities: [image]
      limits:
        combined_input_output_tokens: 872000
        effective_input_tokens: 272000
        output_tokens: 128000
      reasoning:
        contexts: [all_turns]
        default_context: all_turns
        summaries: [none, auto, concise, detailed]
        budget: none
      reasoning_replay:
        format: responses_reasoning
      service_tiers: [priority, ultrafast]
      generation_parameters:
        verbosity: {}
  codex_subscription/gpt-6.2-sol:
    inherit: gpt-6.2-sol
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "2"
          output_per_mtok: "10"
          cached_input_per_mtok: "0.1"
          cache_write_per_mtok: "2.5"
    capabilities:
      input_modalities: [image]
      limits:
        combined_input_output_tokens: 872000
        effective_input_tokens: 500000
        output_tokens: 128000
      reasoning:
        contexts: [all_turns]
        default_context: all_turns
        summaries: [none, auto, concise, detailed]
        budget: none
      reasoning_replay:
        format: responses_reasoning
      service_tiers: [priority, ultrafast]
      generation_parameters:
        verbosity: {}
  codex_subscription/gpt-6.1-terra:
    inherit: gpt-6.1-terra
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "1"
          output_per_mtok: "5"
          cached_input_per_mtok: "0.05"
          cache_write_per_mtok: "1.25"
    capabilities:
      input_modalities: [image]
      limits:
        combined_input_output_tokens: 872000
        effective_input_tokens: 500000
        output_tokens: 128000
      reasoning:
        contexts: [all_turns]
        default_context: all_turns
        summaries: [none, auto, concise, detailed]
        budget: none
      reasoning_replay:
        format: responses_reasoning
      service_tiers: [priority]
      generation_parameters:
        verbosity: {}
  # Codex ext/image-generation selects this model on its subscription image endpoints.
  codex_subscription/gpt-image-2:
    inherit: gpt-image-2
    api_format: openai_images
    pricing:
    wire_options:
      images_path: /images/generations
      images_edits_path: /images/edits
      images_edits_encoding: json
      originator: codex_cli_rs
