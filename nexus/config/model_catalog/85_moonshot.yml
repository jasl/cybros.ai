schema_version: cybros.model_catalog.v1
providers:
  moonshot:
    display_name: Moonshot AI (China)
    api_format: openai_compatible_chat
    # The shared chat protocol owns /v1/chat/completions.
    base_url: https://api.moonshot.cn
models:
  # models.dev/providers/moonshotai-cn/, read 2026-10-19: these are its
  # published USD rates per million tokens, already normalized; no FX
  # conversion is performed here or at runtime. The API platform's prices
  # and model ids are independent of the kimi_code subscription alias.
  # Windows, reasoning controls and preserved-thinking requirements checked
  # against platform.kimi.com/docs/guide/use-thinking-models and the model
  # guides. Video input is outside the kernel's supported input modalities.
  moonshot/kimi-k3:
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "3"
          cached_input_per_mtok: "0.3"
          # The default cache TTL is 5m; no TTL override is exposed here.
          cache_write_per_mtok: "3"
          output_per_mtok: "15"
    capabilities:
      input_modalities: [image]
      limits:
        combined_input_output_tokens: 1048576
        output_tokens: 1048576
      reasoning:
        disable_supported: false
        efforts: [low, high, max]
        # Catalog policy, consistent with other open-model routes.
        default_effort: low
        default_enabled: true
      reasoning_replay:
        format: chat_reasoning
        required_for_tool_rounds: true
      generation_parameters:
        max_output_tokens:
          maximum: 1048576
  moonshot/kimi-k2.6:
    wire_options:
      reasoning_control: thinking
      thinking_keep: all
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "0.95"
          cached_input_per_mtok: "0.16"
          output_per_mtok: "4"
    capabilities:
      input_modalities: [image]
      limits:
        combined_input_output_tokens: 262144
        output_tokens: 262144
      reasoning:
        disable_supported: true
        default_enabled: true
      reasoning_replay:
        format: chat_reasoning
      generation_parameters:
        max_output_tokens:
          maximum: 262144
  # K2.7 always thinks and preserves reasoning; neither thinking controls
  # nor reasoning_effort are needed on its wire. The two speeds have their
  # own model ids and price schedules.
  moonshot/kimi-k2.7-code:
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "0.95"
          cached_input_per_mtok: "0.19"
          output_per_mtok: "4"
    capabilities:
      input_modalities: [image]
      limits:
        combined_input_output_tokens: 262144
        output_tokens: 262144
      reasoning:
        disable_supported: false
        default_enabled: true
      reasoning_replay:
        format: chat_reasoning
        required_for_tool_rounds: true
      generation_parameters:
        max_output_tokens:
          maximum: 262144
  moonshot/kimi-k2.7-code-highspeed:
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "1.9"
          cached_input_per_mtok: "0.38"
          output_per_mtok: "8"
    capabilities:
      input_modalities: [image]
      limits:
        combined_input_output_tokens: 262144
        output_tokens: 262144
      reasoning:
        disable_supported: false
        default_enabled: true
      reasoning_replay:
        format: chat_reasoning
        required_for_tool_rounds: true
      generation_parameters:
        max_output_tokens:
          maximum: 262144
