schema_version: cybros.model_catalog.v1
providers:
  openrouter:
    # THE WIRE THIS PROVIDER SPEAKS. It decides the route, the request
    # shape, the option vocabulary, the timeouts and the tokenizer, so a
    # model under it normally declares nothing at all.
    api_format: openrouter_chat
    base_url: https://openrouter.ai/api
    # OpenRouter reports the total amount charged to this account as the
    # exact decimal `usage.cost`. BYOK responses are excluded by settlement
    # because that value is only the broker fee, not the upstream bill; those
    # responses use the model's catalog fallback.
    native_cost_contract:
      amount_field: cost
      unit: USD
      scale: "1"
      maximum_wire_amount: "99999999999999999999.999999999999999999"
      maximum_fractional_digits: 18
    # Operator capacity, not a wire fact: the same provider admits
    # different amounts of concurrent work per deployment and per account
    # tier. Carried from the predecessor's own providers.yml. A workload
    # with no entry inherits the ceiling.
    concurrency_limit: 8
    workload_concurrency_limits:
      text_generation: 6
models:
  # every root rides the :exacto
  # quality-sorted pool (no endpoint pin).
  #
  # the inventory medians
  # are the authored rates under
  # provider_reported_then_catalog_fallback: billing stays provider-reported
  # usage.cost on an exact USD, non-BYOK match, and the median table is the
  # frozen fallback/floor settlement reads.
  #
  # THE BROKER'S INVENTORY IS THE FACT FOR ITS ROWS (the
  # rows state the provider's facts; nothing waits for a capture). Each
  # row's `reasoning:` is the broker's own `reasoning` object for that id
  # on `/api/v1/models` (read 2026-09-16): `efforts` are its
  # `supported_efforts`, which narrow the `openrouter_chat` wire's
  # vocabulary to the words the upstream takes, and `default_enabled: true`
  # restates its `default_enabled` — an effort-less turn sends no reasoning
  # field and the upstream's own default governs, as it always did, so a
  # plain turn rides byte for byte as before these blocks existed. No
  # `default_effort` is authored: the broker's default is what the wire does
  # when nothing is sent, and restating it would put an effort the caller
  # never chose on every request. No `budget` word either: the inventory
  # lists `supports_max_tokens` on none of these ids. `input_modalities` is
  # the broker's `architecture.input_modalities` — image only, because
  # video has no wire register.
  #
  # EVERY ROW REPLAYS IN THE CHAT MESSAGE'S OWN FIELD (`chat_reasoning`):
  # the assistant message carries its `reasoning_details` back verbatim
  # when the broker sent them, else its `reasoning_content`. OpenRouter's
  # reasoning-tokens page: "the entire sequence of consecutive reasoning
  # blocks must match the outputs generated by the model during the original
  # request". Each row's line names its upstream's own rule; the rows whose
  # upstream refuses a tool round sent back without its reasoning (DeepSeek
  # with tools, Kimi K3) say so as `required_for_tool_rounds`.
  #
  # The three first-party mirrors: the broker answered "provider Terms Of
  # Service" from an account-side entitlement condition.
  # A broker refusal surfaces as a typed provider condition, so
  # the honest posture is a correct error rather than a missing model. Do not
  # name them in a selector: a candidate we expect to be refused must not be
  # routed to by default. (This repository ships no selector at all now —
  # that sentence is guidance for the deployment that writes one.)
  openrouter/anthropic/claude-sonnet-5:exacto:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "2"
          output_per_mtok: "10"
    capabilities:
      input_modalities: []
      output_modalities: [text]
      limits:
        combined_input_output_tokens: 200000
      reasoning:
        efforts: [low, medium, high, xhigh, max]
        default_enabled: true
      # the upstream's signed thinking blocks ride `reasoning_details`, returned as the broker sent them.
      reasoning_replay:
        format: chat_reasoning
  # The broker's card for `openai/gpt-6-sol` (openrouter.ai/api/v1/models,
  # read 2026-09-26; canonical `openai/gpt-6-sol-20260922`). Rates are its
  # per-token prices per million — `pricing.prompt` 0.000002,
  # `completion` 0.00001, `input_cache_read` 0.0000002,
  # `input_cache_write` 0.0000025 — and its one `overrides` entry, at
  # `min_prompt_tokens` 272000, prices 0.000004 / 0.000015 / 0.0000004 /
  # 0.000005: 2x input and cache, 1.5x completion, the vendor's own
  # long-context tier, authored as a threshold and two multipliers. The
  # card's endpoints (openrouter.ai/api/v1/models/openai/gpt-6-sol/
  # endpoints, the same read) price other routes differently — the
  # regional Azure and Bedrock endpoints 2.2 / 11, OpenAI's flex and fast
  # tags half and double — which is inert while `usage.cost` is the
  # authority: the fallback fills only a missing receipt. The window and
  # the ceiling are the card's `context_length` and
  # `top_provider.max_completion_tokens`, 1 050 000 and 128 000, which
  # every listed endpoint repeats — one shared window, as the direct row
  # records. `architecture.input_modalities` lists file, image and text (a
  # file has no wire register); the reasoning object lists efforts none
  # through max, on by default, not mandatory. The inventory lists no
  # `:exacto` id for any model: the variant is virtual, and the model page
  # (openrouter.ai/openai/gpt-6-sol:exacto, the same read) names `exacto`
  # among this id's virtual variants beside `nitro` and `floor`.
  openrouter/openai/gpt-6-sol:exacto:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "2"
          output_per_mtok: "10"
          cached_input_per_mtok: "0.2"
          cache_write_per_mtok: "2.5"
          long_context_threshold_tokens: "272000"
          long_context_input_multiplier: "2"
          long_context_output_multiplier: "1.5"
    capabilities:
      input_modalities: [image]
      output_modalities: [text]
      # The price step plans the input, as on the direct row
      # (openai_api/gpt-6-sol's note); the window stays the hard bound.
      limits:
        combined_input_output_tokens: 1050000
        effective_input_tokens: 272000
        output_tokens: 128000
      reasoning:
        efforts: [none, low, medium, high, xhigh, max]
        default_enabled: true
      # the upstream's encrypted reasoning rides `reasoning_details`, returned as the broker sent them.
      reasoning_replay:
        format: chat_reasoning
  openrouter/google/gemini-3.7-flash:exacto:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "0.525"
          output_per_mtok: "2.625"
    capabilities:
      input_modalities: []
      output_modalities: [text]
      limits:
        combined_input_output_tokens: 200000
      reasoning:
        efforts: [low, medium, high]
        default_enabled: true
      # the upstream's thought signatures ride `reasoning_details`, returned as the broker sent them.
      reasoning_replay:
        format: chat_reasoning
  # The plain broker model id is the catalog key. This id has NO `:exacto`
  # sibling row: `:exacto` is the broker's routing suffix, not an inventory row,
  # and the `/api/v1/models` reads of 2026-09-12 and 2026-09-13 list
  # `moonshotai/kimi-k3` and its `:batch` sibling alone (the variant row that
  # stood here with a 200 000 window was dropped 2026-09-13 — one row per broker
  # inventory id); this row follows the broker's inventory for the plain id on
  # 2026-09-11 — a 1 048 576-token window, so the composer's 1 MiB byte wall
  # fires first, as on glm-5.3. THE VISION ROW: the broker's
  # `architecture.input_modalities` read on 2026-09-12 lists text, image and
  # video for this id (`z-ai/glm-5.3` lists text alone), so `image` is declared
  # here — the paid `live_vision` lane's own default row — against the
  # `openrouter_chat` wire's image register; video stays undeclared (no wire
  # register drives it). The fallback rates are the broker's per-token prices for
  # this id on `/api/v1/models`, per million (`pricing.prompt` 0.000003,
  # `pricing.completion` 0.000015, read 2026-09-17; corrected from the 2026-09-13
  # headline 2.648138063 / 13.28272425, which was one endpoint's price the card
  # has since moved off; billing is provider-reported, the fallback only fills a
  # missing receipt). The reasoning block is the broker's object for this id
  # (efforts low, high, max; on by default) — the bench runs without
  # `--reasoning`, and a plain turn sends nothing either way. The cache-read rate
  # is the broker's `pricing.input_cache_read` for this id (0.0000003 per token
  # on the same read; without it the fallback formula bills a hit at the FULL
  # input rate — inert while `usage.cost` is the authority, the bill itself for
  # BYOK and any receipt without one); no cache-write rate is listed, so a write
  # bills at the input rate. The window and the ceiling are the card's
  # `context_length` and `top_provider.max_completion_tokens` of the same read,
  # unchanged; the inventory read of 2026-09-17 re-read
  # `architecture.input_modalities` for this id and `z-ai/glm-5.3`: text, image,
  # video here, text alone there — both rows already said so.
  openrouter/moonshotai/kimi-k3:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "3"
          output_per_mtok: "15"
          cached_input_per_mtok: "0.3"
    capabilities:
      input_modalities: [image]
      output_modalities: [text]
      limits:
        input_tokens: 1048576
        output_tokens: 943718
      reasoning:
        efforts: [low, high, max]
        default_enabled: true
      # Kimi's quickstart: "add the complete assistant message returned by the API to the next request".
      reasoning_replay:
        format: chat_reasoning
        required_for_tool_rounds: true
  openrouter/z-ai/glm-5.2:exacto:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "1.4"
          output_per_mtok: "4.4"
    capabilities:
      input_modalities: []
      output_modalities: [text]
      limits:
        combined_input_output_tokens: 200000
      reasoning:
        efforts: [high, xhigh]
        default_enabled: true
      # Z.ai's thinking guide: preserved thinking needs "the complete, unmodified reasoning_content".
      reasoning_replay:
        format: chat_reasoning
  # TWO FLASH-TIER CODING MODELS, the ones that drive real agent loops
  # from rho. They are the first entries here WITHOUT `:exacto` —
  # not a change of policy but a fact about the broker: neither model has
  # a quality-sorted pool, so naming one would route to nothing.
  #
  # Limits, rates, reasoning and modalities are the broker's OWN inventory
  # (`/api/v1/models`, read 2026-09-16): both ids list `reasoning` on by
  # default with efforts low, high and max; the DeepSeek id lists text and
  # image, the GLM id text, image and video (video stays undeclared — no
  # wire register drives it). Both rows carry the broker's
  # `input_cache_read` (without it the
  # fallback formula bills a hit at the full input rate), re-read
  # 2026-09-16 02:12 UTC.
  #
  # THE DEEPSEEK ID IS PRICED BY THE CLOCK: the broker's `pricing` object
  # lists the off-peak base (prompt 0.15 / completion 0.6 / cache read
  # 0.003) plus `overrides` that DOUBLE all three on weekdays 01:00–04:00
  # and 06:00–10:00 UTC, and its top-level `prompt` reflects whichever
  # window a read falls in. One flat row carries the PEAK half (on
  # the direct `deepseek/deepseek-flash` row: the
  # fallback number is a floor and takes the rate that is never too low),
  # so 0.3 / 1.2 stand and the cache read is the peak 0.006 — a base-window
  # read of 0.15 is not a drift.
  openrouter/deepseek/deepseek-v4.1-flash:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "0.3"
          output_per_mtok: "1.2"
          cached_input_per_mtok: "0.006"
    capabilities:
      input_modalities: [image]
      output_modalities: [text]
      limits:
        input_tokens: 1048576
        output_tokens: 384000
      reasoning:
        efforts: [low, high, max]
        default_enabled: true
      # DeepSeek's thinking guide, with tools: "the reasoning_content of all previous turns should be passed back".
      reasoning_replay:
        format: chat_reasoning
        required_for_tool_rounds: true
  # THE PRO SNAPSHOT of the same family. Rates (the broker's per-token
  # prices, per million), window, output ceiling and modalities are the
  # broker's `/api/v1/models` inventory read 2026-09-16 — the rates at
  # 02:12 UTC (an earlier read the same day, 22:57 UTC-8, had listed
  # 0.57948 / 1.73844 / 0.018438 with no `overrides` object: the broker
  # re-prices this id within a day, and the row carries the latest read);
  # the broker's plain `deepseek/deepseek-v4-pro` id is the 0423 snapshot
  # at other prices and is not this row. The broker's reasoning object for this id names the
  # efforts and the default but carries no `default_enabled`; thinking on
  # by default is the vendor's own statement for the served model
  # (api-docs.deepseek.com, the same page the direct `deepseek-v4-pro`
  # row reads).
  openrouter/deepseek/deepseek-v4-pro-0813:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "0.9834"
          output_per_mtok: "2.9502"
          cached_input_per_mtok: "0.03278"
    capabilities:
      input_modalities: []
      output_modalities: [text]
      limits:
        input_tokens: 1048576
        output_tokens: 393216
      reasoning:
        efforts: [low, high, max]
        default_enabled: true
      # DeepSeek's thinking guide, with tools: "the reasoning_content of all previous turns should be passed back".
      reasoning_replay:
        format: chat_reasoning
        required_for_tool_rounds: true
  # The GLM flash id moved between two reads of 2026-09-16 (0.075 / 0.25 /
  # cache read 0.015 at 22:57 UTC-8 the evening before; 0.1 / 0.3333 / 0.02
  # at 02:12 UTC) with no `overrides` object — the latest read stands, and
  # the 0.07 / 0.2333 that stood here was an older read still.
  openrouter/z-ai/glm-5.3-flash:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "0.1"
          output_per_mtok: "0.3333"
          cached_input_per_mtok: "0.02"
    capabilities:
      input_modalities: [image]
      output_modalities: [text]
      limits:
        input_tokens: 1310720
        output_tokens: 131072
      reasoning:
        efforts: [low, high, max]
        default_enabled: true
      # Z.ai's thinking guide: preserved thinking needs "the complete, unmodified reasoning_content".
      reasoning_replay:
        format: chat_reasoning
  # Limits and rates are the broker's inventory on 2026-09-10; text
  # only, because that is all the broker lists for this model.
  openrouter/z-ai/glm-5.3:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "1.4"
          output_per_mtok: "4.4"
          # The broker's own `input_cache_read` for this model
          # (openrouter.ai/api/v1/models, `pricing.input_cache_read`
          # 0.00000026 per token, read 2026-09-12; the same figure the
          # 2026-09-10 inventory listed). No cache-write rate is listed,
          # so a write bills at the input rate, as the formula defaults.
          cached_input_per_mtok: "0.26"
    capabilities:
      input_modalities: []
      output_modalities: [text]
      limits:
        input_tokens: 1310720
        output_tokens: 943718
      reasoning:
        efforts: [low, high, max]
        default_enabled: true
      # Z.ai's thinking guide: preserved thinking needs "the complete, unmodified reasoning_content".
      reasoning_replay:
        format: chat_reasoning
  openrouter/tencent/hy3:exacto:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "0.132"
          output_per_mtok: "0.5336"
    capabilities:
      input_modalities: []
      output_modalities: [text]
      limits:
        combined_input_output_tokens: 200000
      reasoning:
        efforts: [none, low, high]
        default_enabled: true
      # Hy3's chat template renders an assistant message's reasoning_content when tools are present.
      reasoning_replay:
        format: chat_reasoning
  # RE-PINNED to the id the broker's inventory carries (`/api/v1/models`,
  # read 2026-09-16): `qwen/qwen3.8-max-0902` (canonical
  # `qwen3.8-max-20260902`), the family's current snapshot; the bare
  # `qwen/qwen3.8-max` the 2026-08-14 row named is no longer listed. The
  # `:exacto` suffix OBSERVED on this id (one paid call, 2026-09-18): the
  # broker answers 200 with the variant on the model_pin, the wire echoes
  # the base slug `qwen/qwen3.8-max-0902` and Alibaba served it, priced
  # at the rates below (68 prompt tokens 0.000136, 8 completion tokens
  # 0.000048 in the broker's `cost_details`); the effort-less call
  # reasoned, so the default is on. Rates are the broker's own per-token
  # prices per million (prompt 0.000002, completion 0.000006,
  # input_cache_read 0.00000025, input_cache_write 0.0000025); window and
  # output ceiling its `context_length` / `max_completion_tokens`; text,
  # image and video in (video stays undeclared — no wire register drives
  # it); the broker's reasoning object lists efforts minimal, low, medium,
  # high, xhigh, on by default (mandatory) — an effort-less turn selects
  # the broker's own default and nothing rides the wire.
  openrouter/qwen/qwen3.8-max-0902:exacto:
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "2"
          output_per_mtok: "6"
          cached_input_per_mtok: "0.25"
          cache_write_per_mtok: "2.5"
    capabilities:
      input_modalities: [image]
      output_modalities: [text]
      limits:
        input_tokens: 1000000
        output_tokens: 131072
      reasoning:
        efforts: [minimal, low, medium, high, xhigh]
        default_enabled: true
      # Qwen's thinking guide: earlier reasoning_content is read only under preserve_thinking, ignored otherwise.
      reasoning_replay:
        format: chat_reasoning
