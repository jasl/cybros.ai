# OpenRouter forwards OpenAI retention and Claude automatic cache breakpoints.
# https://openrouter.ai/docs/guides/best-practices/prompt-caching
schema_version: cybros.model_catalog.v1
providers:
  openrouter:
    # THE WIRE THIS PROVIDER SPEAKS. It decides the route, the request
    # shape, the option vocabulary, the timeouts and the tokenizer, so a
    # model under it normally declares nothing at all.
    api_format: openrouter_chat
    base_url: https://openrouter.ai/api
    # OpenRouter reports the total amount charged to this account as the
    # exact decimal `usage.cost`. BYOK responses are excluded by settlement
    # because that value is only the broker fee, not the upstream bill; those
    # responses use the model's catalog fallback.
    native_cost_contract:
      amount_field: cost
      unit: USD
      scale: "1"
      maximum_wire_amount: "99999999999999999999.999999999999999999"
      maximum_fractional_digits: 18
    # Operator capacity, not a wire fact: the same provider admits
    # different amounts of concurrent work per deployment and per account
    # tier. Carried from the predecessor's own providers.yml. A workload
    # with no entry inherits the ceiling.
    concurrency_limit: 8
    workload_concurrency_limits:
      text_generation: 6
models:
  # Native System One route; the leading ~ is part of the provider's alias.
  # https://openrouter.ai/~typesafe/jev-latest
  openrouter/jev-latest:
    model_id: ~typesafe/jev-latest
    api_format: typesafe_system_one
    capabilities: {}
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "0.042"
          output_per_mtok: "0"
  # Facts from https://openrouter.ai/api/v1/models and the per-model /endpoints
  # inventory on 2026-11-21. All chat routes use the broker's reasoning_details
  # protocol. The media register supports images. A heterogeneous pool has no
  # uniform max_tokens parameter maximum; the model card bounds local planning.
  # Prices are USD per million tokens, used when there is no billable usage.cost.
  # Catalog effort defaults are high for Claude and Qwen Max, medium for GPT
  # and Gemini, and low for open-weight models that accept it.
  # Gemini cache-write estimates are rounded to the catalog's 12 decimal places.
  # All GPT endpoints independently cap the prompt at 922,000 and output at
  # 128,000, as in the shared definitions. The 272,000 price step guides planning.
  openrouter/openai/gpt-6.2-astra:
    inherit: gpt-6.2-astra
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
        rates:
          input_per_mtok: "8"
          output_per_mtok: "40"
          cached_input_per_mtok: "0.4"
          cache_write_per_mtok: "10"
          cache_write_12h_per_mtok: "20"
          long_context_threshold_tokens: "272000"
          long_context_input_multiplier: "2"
          long_context_output_multiplier: "1.5"
    capabilities:
      input_modalities: [image]
      generation_parameters:
        prompt_cache_ttl:
          allowed_values: [30m, 12h]
        max_output_tokens:
          maximum: 128000
      reasoning_replay:
        format: chat_reasoning
  openrouter/openai/gpt-6.2-sol:
    inherit: gpt-6.2-sol
    pricing:
      account_unit: USD
      schedule:
        kind: provider_reported_then_catalog_fallback
