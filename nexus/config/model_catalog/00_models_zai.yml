schema_version: cybros.model_catalog.v1
# Explicit model facts shared by provider routes. Serving limits may override
# the complete limits block; protocol options and pricing stay on each route.
model_definitions:
  glm-5.2:
    token_counter:
      kind: huggingface
      tokenizer_id: zai-org/GLM-5.2
    capabilities:
      limits:
        combined_input_output_tokens: 200000
      reasoning:
        disable_supported: true
        efforts: [high, xhigh]
        default_effort: high
        default_enabled: true
  glm-5.3-flash:
    # These official GLM releases have byte-identical tokenizer.json files;
    # config/tokenizers.json pins their shared vocabulary once.
    token_counter:
      kind: huggingface
      tokenizer_id: zai-org/GLM-5.2
    capabilities:
      input_modalities: [image]
      limits:
        input_tokens: 1310720
        output_tokens: 131072
      reasoning:
        efforts: [low, high, max]
        default_effort: low
        default_enabled: true
  glm-5.3:
    token_counter:
      kind: huggingface
      tokenizer_id: zai-org/GLM-5.2
    capabilities:
      limits:
        input_tokens: 1310720
        output_tokens: 943718
      reasoning:
        efforts: [low, high, max]
        default_effort: low
        default_enabled: true
