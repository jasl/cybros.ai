schema_version: cybros.model_catalog.v1
# Explicit model facts shared by provider routes. Serving limits may override
# the complete limits block; protocol options and pricing stay on each route.
model_definitions:
  # OpenAI publishes independent input/output ceilings in the 1,050,000-token window.
  gpt-6.2-astra:
    capabilities:
      input_modalities: [image, file]
      limits:
        input_tokens: 922000
        effective_input_tokens: 272000
        output_tokens: 128000
      reasoning:
        efforts: [low, medium, high, xhigh, max]
        default_effort: medium
  gpt-6.2-sol:
    capabilities:
      input_modalities: [image, file]
      limits:
        input_tokens: 922000
        effective_input_tokens: 272000
        output_tokens: 128000
      reasoning:
        efforts: [low, medium, high, xhigh, max]
        default_effort: medium
  gpt-6.1-terra:
    capabilities:
      input_modalities: [image, file]
      limits:
        input_tokens: 922000
        effective_input_tokens: 272000
        output_tokens: 128000
      reasoning:
        efforts: [low, medium, high, xhigh, max]
        default_effort: medium
  gpt-image-2.6-sunburst:
    capabilities:
      input_modalities: [image]
      limits:
        result_count: 1
  gpt-image-2.6-flare:
    capabilities:
      input_modalities: [image]
      limits:
        result_count: 1
  gpt-image-2:
    capabilities:
      input_modalities: [image]
      limits:
        result_count: 1
  gpt-4o-mini-tts-2025-12-15:
    capabilities:
      limits:
        input_bytes: 2000
        # The Create Speech API's character bound. The deployment's
        # input_bytes cap is narrower; the profile enforces both before IO.
        input_characters: 4096
  gpt-4o-mini-transcribe-2025-12-15:
    capabilities:
      input_modalities: [audio]
  text-embedding-3-large:
    capabilities:
      limits:
        input_tokens: 8191
        input_bytes: 8191
