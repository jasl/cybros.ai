schema_version: cybros.model_catalog.v1
# The Messages API accepts up to 1M input tokens and stops generation if the
# shared window fills before max_tokens. Nexus selects high effort for Claude.
model_definitions:
  claude-fable-5-2:
    capabilities:
      input_modalities: [image, file]
      limits:
        input_tokens: 1000000
        output_tokens: 128000
      reasoning:
        efforts: [low, medium, high, xhigh, max]
        default_effort: high
  claude-opus-5-5:
    capabilities:
      input_modalities: [image, file]
      limits:
        input_tokens: 1000000
        output_tokens: 128000
      reasoning:
        efforts: [low, medium, high, xhigh, max]
        default_effort: high
  claude-sonnet-5-5:
    capabilities:
      input_modalities: [image, file]
      limits:
        input_tokens: 1000000
        output_tokens: 128000
      reasoning:
        efforts: [low, medium, high, xhigh, max]
        default_effort: high
  claude-haiku-5-5:
    capabilities:
      input_modalities: [image, file]
      limits:
        input_tokens: 1000000
        output_tokens: 128000
      reasoning:
        disable_supported: true
        efforts: [low, medium, high, xhigh, max]
        default_effort: high
