schema_version: cybros.model_catalog.v1
providers:
  gemini:
    # THE WIRE THIS PROVIDER SPEAKS. It decides the route, the request
    # shape, the option vocabulary, the timeouts and the tokenizer, so a
    # model under it normally declares nothing at all.
    api_format: gemini_generate_content
    base_url: https://generativelanguage.googleapis.com
    # Operator capacity, not a wire fact: the same provider admits
    # different amounts of concurrent work per deployment and per account
    # tier. Carried from the predecessor's own providers.yml. A workload
    # with no entry inherits the ceiling.
    concurrency_limit: 6
    workload_concurrency_limits:
      text_generation: 3
      embedding: 1
models:
  # Streaming GenerateContent supports one 65,536-token response per request.
  # Longer output requires continuation. https://aistudio.google.com/docs/long-decode
  # Standard paid-tier USD rates per million tokens, including implicit cache reads.
  # Argon and Carbon introductory rates run through 2026-11-30. From 2026-12-01
  # Google lists 4 for input, 20 for output and 0.2 for cached input.
  # https://aistudio.google.com/docs/pricing
  gemini/gemini-4-argon:
    inherit: gemini-4-argon
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "2"
          output_per_mtok: "10"
          cached_input_per_mtok: "0.1"
    capabilities:
      limits:
        combined_input_output_tokens: 1048576
        output_tokens: 65536
      generation_parameters:
        max_output_tokens:
          maximum: 65536
      reasoning_replay:
        format: gemini_thought
  gemini/gemini-4-hydrogen:
    inherit: gemini-4-hydrogen
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "1.5"
          output_per_mtok: "7.5"
          cached_input_per_mtok: "0.075"
    capabilities:
      limits:
        combined_input_output_tokens: 1048576
        output_tokens: 65536
      generation_parameters:
        max_output_tokens:
          maximum: 65536
      reasoning_replay:
        format: gemini_thought
  gemini/gemini-4-neon:
    inherit: gemini-4-neon
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "3"
          output_per_mtok: "15"
          cached_input_per_mtok: "0.15"
    capabilities:
      limits:
        combined_input_output_tokens: 1048576
        output_tokens: 65536
      generation_parameters:
        max_output_tokens:
          maximum: 65536
      reasoning_replay:
        format: gemini_thought
  gemini/gemini-4-carbon:
    inherit: gemini-4-carbon
    pricing:
      account_unit: USD
      schedule:
        kind: catalog_only
        rates:
          input_per_mtok: "2"
          output_per_mtok: "10"
          cached_input_per_mtok: "0.1"
    capabilities:
      limits:
        combined_input_output_tokens: 1048576
        output_tokens: 65536
      generation_parameters:
        max_output_tokens:
          maximum: 65536
      reasoning_replay:
        format: gemini_thought
