zh-CN:
  conversation_cancellation:
    title: 停止此会话的执行
    submit: 停止此会话的执行
    scope: 停止提交时此会话已有的执行，包括回复、历史后台工作及其派生工作。可复用子会话中后来的独立执行会保留。
    queued: 普通排队输入会保留，并可能在停止后开始新的执行。排程保持不变；此操作不会暂停会话。
    preserved: 已发布的回复、已完成的结果和外部效果不会撤销。
    follow: 提交后可从回复候选及其原运行查看当前状态。已完成的回复在后台工作停止后仍可保持完成状态；这些页面不能证明所有派生工作均已停止。
    accepted: 停止请求已接受。工作可能仍在停止中，排队输入也可能开始新的执行。
    not_running: 此会话当前没有剩余工作可停止。可返回会话查看当前状态。
    return_to_conversation: 返回会话
    refusals:
      not_found: 此会话已不可用。
      not_authorized: 你无权停止此会话的执行。
