zh-CN:
  work_recovery:
    cost_limit:
      title: 编辑费用限额
      explanation: 限额按本对话已记录的已知累计费用判断。已准入的调用仍可完成；未定价和免费调用保持原有行为。
      no_restart: 提高或清除限额不会自动恢复执行。请重试原来等待处理的任务，或通过应用或 SDK 继续没有 Run 的直接回复。已完成的工具及其结果会保留。
      amount: 费用限额（%{unit}）
      unit_missing: 未配置单位
      no_unit: 账户尚未配置费用单位，配置前无法保存非空限额。
      amount_help: 请输入非负金额，最多保留 18 位小数。留空表示取消限额；零表示阻止新的计费调用。
      save: 保存费用限额
      save_current: 使用当前版本保存我的草稿
      saved: 费用限额已保存。准备好后请显式恢复失败的执行。
      conflict: 打开表单后对话已发生变化。你填写的金额已保留，请核对当前限额，再按最新版本保存草稿。
      current: 当前限额：%{amount} %{unit}
      failed: 此模型调用因达到对话费用限额而停止。
