zh-CN:
  pagination:
    nouns:
      store_entries: Store 条目
  data_console:
    title: 工作区数据
    description: 管理此工作区自己的 Memory、character 和 Store。个人、Agent 和 Conversation 数据各有独立作用域。
    back: 返回工作区数据
    read_only: 此工作区当前可读，但不可写入。
    edit: 编辑
    delete: 删除
    filter: 筛选
    clear: 清除
    read_saved: 阅读已保存的值
    memory:
      title: 工作区 Memory
      description: workspace/ 下的文本文档。每个新回合都可读取其当前内容。
      new: 新建记忆文档
      open: 打开文档
      edit: 编辑记忆文档
      back: 返回工作区 Memory
      empty: 此工作区还没有记忆文档。
      path: 文档路径
      path_help: 使用 workspace/ 加文档名，例如 workspace/notes.md。创建后不能修改路径。
      skill_description: Skill 描述
      description_help: 仅 workspace/skills/<name> 需要描述。普通记忆文档请留空。
      content: 记忆内容
      metadata: "版本 %{version} · %{bytes} 字节 · 写入于 %{time}"
      save: 保存记忆文档
      saved: 记忆文档已保存。
      deleted: 记忆文档已删除。
      retention: 保存会替换当前内容。没有版本历史或回收站。
      delete_confirmation: 删除此记忆文档？没有回收站。
      override_help: 工具提供方接管此工作区的记忆时，普通 kernel Memory 管理不可用。精确的 workspace/skills/ 路径保留既有的 kernel 访问能力。
    character:
      title: 工作区 character
      description: 工作区的提示词文档，供包含 character 槽位的提示词模板使用。
      edit: 编辑 character
      back: 返回工作区 character
      content: Character 内容
      empty: 此工作区还没有 character 文档。
      metadata: "版本 %{version} · %{bytes} 字节 · 角色：%{role}"
      replace_help: 保存会替换当前 character，包括其他编辑者刚保存的内容。空文本也是已保存的文档；删除才会移除它。版本号记录写入次数，不用于编辑冲突检查。
      save: 保存 character
      saved: Character 已保存。
      delete: 删除 character
      deleted: Character 已删除。
      delete_confirmation: 删除 character 文档？没有版本历史或回收站。
    store:
      title: 工作区 Store
      description: 应用可能使用这些按命名空间保存的 JSON 值。编辑或删除可能改变应用的已保存状态。Store 值不会作为记忆注入提示词。
      new: 新建 Store 条目
      edit: 编辑 Store 条目
      back: 返回工作区 Store
      empty: 没有匹配此命名空间的 Store 条目。
      namespace: 命名空间
      key: 键
      value: JSON 值
      value_help: 输入任意合法 JSON 值，包括 null、false 或数组。JSON null 是一个值，不代表删除。
      identity_help: 创建后不能修改命名空间和键。
      metadata: "版本 %{version} · 更新于 %{time}"
      pages: Store 分页
      save: 保存 Store 条目
      saved: Store 条目已保存。
      deleted: Store 条目已删除。
      delete_confirmation: 删除此 Store 条目？应用可能依赖它，且没有回收站。
    attachments:
      title: 保留内容中的附件
      description: 附件属于保留的消息和结果。进入 Conversation 预览或下载附件，或检查 Run 和 Task 内容。工作区没有独立文件目录。
      conversations: 浏览 Conversations
      runs: 浏览 Runs
    errors:
      not_authorized: 此工作区当前不可写入。草稿已保留。
      workspace_not_active: 此工作区当前不可写入。草稿已保留。
      workspace_agent_identifier_mismatch: 此工作区不允许该 Agent 写入。
      stale_object: 已保存的值发生变化或已删除。草稿及其原版本已保留。请先阅读已保存的值，再重新开始编辑；本次提交无法覆盖它。
      invalid_precondition: 缺少有效的文档标识或版本。请重新读取文档后再开始编辑。
      memory_overridden: "Memory 由 %{detail} 提供。普通 kernel Memory 管理不可用。"
      memory_path_invalid: 请使用有效的 workspace/ 文档路径。
      memory_scope_unavailable: 此页面只管理当前工作区的 workspace/ 作用域。
      memory_not_found: 记忆文档已不存在。
      memory_content_invalid: 请输入记忆文档文本。
      memory_description_invalid: 普通文档不能有描述。Skill 描述必须是 1,024 字节以内的文本。
      memory_full: 此工作区已达到 64 份记忆文档的上限。
      memory_document_too_large: 记忆文档超过 64 KiB 内容上限。
      skill_name_invalid: 请在 workspace/skills/ 后使用有效的 Skill 名称。
      skill_scope_unavailable: 此作用域不能保存 Skill。
      skill_description_required: 请填写此 Skill 文档的描述。
      prompt_document_invalid: 无法保存 character。请检查文本和角色。
      prompt_document_too_large: Character 超过 64 KiB 内容上限。
      prompt_document_macro_unknown: "未知宏：%{detail}。草稿已保留。"
      prompt_slot_unavailable: 此工作区不支持该提示词槽位。
      prompt_document_not_found: Character 文档已不存在。
      invalid: 无法保存 Store 条目。请检查下方字段。
      invalid_json: 请输入合法 JSON。原文本已保留。
      unsupported_json: 此 JSON 无法保存。不支持指数形式数字、U+0000 或无效 UTF-8；请将指数形式数字保存为字符串。
      invalid_idempotency_key: 创建请求标识缺失或无效。请重新打开新建条目表单。
      idempotency_envelope_mismatch: 此创建请求已经保存了不同字段。草稿已保留；如需创建其他值，请打开新的条目表单。
      entry_limit_reached: 此工作区已达到 64 个 Store 条目的上限。
      key_taken: 此命名空间和键已存在。请打开原条目进行编辑。
