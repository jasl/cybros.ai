default: &default
  adapter: postgresql
  encoding: unicode
  # Puma needs one connection per request thread. Solid Queue's fiber workers
  # reuse short-lived connections while its poller and heartbeat also connect,
  # so a five-connection pool provides conservative worker headroom.
  # Pools are process-local, so use the larger requirement rather than adding
  # both workloads. RAILS_DB_POOL bypasses this automatic sizing.
  pool: <%= ENV.fetch("RAILS_DB_POOL") { [Integer(ENV.fetch("RAILS_MAX_THREADS", 3)), 5].max } %>
  variables:
    # Bound non-deadlock lock waits: lane transactions are millisecond-short,
    # so a wait this long means a stuck holder; failing fast beats queueing
    # requests behind it. PG's deadlock detector (1s) still resolves cycles.
    lock_timeout: <%= ENV.fetch("RAILS_DB_LOCK_TIMEOUT", "10s") %>

development:
  primary:
    <<: *default
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_APP_DB_NAME", "cybros_nexus_primary_development") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_APP_DB_NAME", "cybros_nexus_primary_development") %>
    <% end %>
  queue:
    <<: *default
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_QUEUE_DB_NAME", "cybros_nexus_queue_development") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_QUEUE_DB_NAME", "cybros_nexus_queue_development") %>
    <% end %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_CABLE_DB_NAME", "cybros_nexus_cable_development") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_CABLE_DB_NAME", "cybros_nexus_cable_development") %>
    <% end %>
    migrations_paths: db/cable_migrate

  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: dummy

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
# Test mirrors production's SHAPE, not its adapters: the cable role exists here
# so the cable schema is loadable and a test can address that database, while
# config/cable.yml keeps the `test` adapter — an in-process bus is what makes a
# broadcast assertion deterministic. Without the role, a wake-channel test
# could not even reach the tables it is meant to trim or replay.
# Development database tasks also load this section in the same process. Test
# names have separate overrides so tests cannot reuse development database names.
test:
  primary:
    <<: *default
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_TEST_APP_DB_NAME", "cybros_nexus_test") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_TEST_APP_DB_NAME", "cybros_nexus_test") %>
    <% end %>
  cable:
    <<: *default
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_TEST_CABLE_DB_NAME", "cybros_nexus_cable_test") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_TEST_CABLE_DB_NAME", "cybros_nexus_cable_test") %>
    <% end %>
    migrations_paths: db/cable_migrate

# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
# Production connects through RAILS_DB_URL_BASE when set (external
# PostgreSQL; URL-encode credentials yourself), otherwise through libpq's
# discrete PGHOST/PGUSER/PGPASSWORD variables — no password-in-URI encoding
# hazard (the compose stack uses the discrete form).
production:
  primary: &primary_production
    <<: *default
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_APP_DB_NAME", "cybros_nexus_primary_production") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_APP_DB_NAME", "cybros_nexus_primary_production") %>
    <% end %>
  cache:
    <<: *primary_production
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_CACHE_DB_NAME", "cybros_nexus_cache_production") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_CACHE_DB_NAME", "cybros_nexus_cache_production") %>
    <% end %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_QUEUE_DB_NAME", "cybros_nexus_queue_production") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_QUEUE_DB_NAME", "cybros_nexus_queue_production") %>
    <% end %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    <% if ENV["RAILS_DB_URL_BASE"] %>
    url: "<%= ENV["RAILS_DB_URL_BASE"] %>/<%= ENV.fetch("RAILS_CABLE_DB_NAME", "cybros_nexus_cable_production") %>"
    <% else %>
    database: <%= ENV.fetch("RAILS_CABLE_DB_NAME", "cybros_nexus_cable_production") %>
    <% end %>
    migrations_paths: db/cable_migrate
